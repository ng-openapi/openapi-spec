name: Validate OpenAPI Specs

on:
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "REFERENCE.yaml"
      - ".github/workflows/validate-specs.yml"
  pull_request:
    paths:
      - "specs/**"
      - "REFERENCE.yaml"
      - ".github/workflows/validate-specs.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate ${{ matrix.spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - specs/v2-swagger.yaml
          - specs/v3.0-openapi.yaml
          - specs/v3.1-openapi.yaml
          - specs/v3.2-openapi.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Redocly lint
        run: npx --yes @redocly/cli@latest lint "${{ matrix.spec }}" --format=stylish

      # Spectral's oas ruleset has no OpenAPI 3.2 schema yet: it validates a
      # 3.2 document against the 3.0 one and rejects `query` operations and
      # everything 3.1 added. Redocly above does validate 3.2. Drop this
      # condition once Spectral recognizes `openapi: 3.2.x`.
      - name: Spectral lint (oas ruleset)
        if: matrix.spec != 'specs/v3.2-openapi.yaml'
        run: npx --yes @stoplight/spectral-cli@latest lint "${{ matrix.spec }}" --ruleset .spectral.yaml --fail-severity=error
